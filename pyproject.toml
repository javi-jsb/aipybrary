[project]
name = "aipybrary"
version = "0.1.0"
description = "Book library REST API built with FastAPI and SQLModel — AI-assisted learning project"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Javi", email = "26868500+javi-jsb@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.4",
    "fastapi[standard]==0.136.1",
    "greenlet==3.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.1",
    "sqlmodel==0.0.38",
    "uuid-utils==0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
